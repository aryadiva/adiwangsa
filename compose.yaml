name: construction-ops

services:
    # PHP runtime base image (Sail's PHP 8.5 runtime, trackable via docker/8.5).
    php-base:
        build:
            context: './docker/8.5'
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
                WWWUSER: '${WWWUSER:-1000}'
        image: 'sail-8.5/app:latest'
        restart: 'no'
        command: 'true'
        networks:
            - sail

    # Self-bootstrap web: build base + app layer, provision, serve on :80.
    laravel.test:
        build:
            context: '.'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
                WWWUSER: '${WWWUSER:-1000}'
        image: 'construction-ops/app:latest'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:5173'
        environment:
            APP_ROLE: 'web'
            WWWUSER: '${WWWUSER:-1000}'
            WWWGROUP: '${WWWGROUP:-1000}'
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-sail}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-password}'
            DOCKER_STATE_DIR: '/var/www/html/storage/.docker'
        volumes:
            - app-state:/var/www/html/storage/.docker
        networks:
            - sail
        depends_on:
            - php-base
            - pgsql
            - redis
            - mailpit
            - minio
        restart: unless-stopped

    # Queue worker: same baked app image, no provisioning, just the worker.
    worker:
        image: 'construction-ops/app:latest'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            APP_ROLE: 'worker'
            WWWUSER: '${WWWUSER:-1000}'
            WWWGROUP: '${WWWGROUP:-1000}'
        networks:
            - sail
        depends_on:
            - laravel.test
        restart: unless-stopped
        command: >
            sh -c 'while true; do
                php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --stop-when-empty;
                sleep 5;
            done'

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-password}'
            POSTGRES_DB: '${DB_DATABASE:-construction_ops}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-construction_ops}', '-U', '${DB_USERNAME:-sail}']
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

    minio:
        image: 'minio/minio:latest'
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-sail}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-password}'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
        volumes:
            - 'sail-minio:/data'
        networks:
            - sail
        restart: unless-stopped
        command: 'minio server /data --console-address ":8900"'
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            retries: 3
            timeout: 5s

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
    sail-redis:
    sail-minio:
    app-state: